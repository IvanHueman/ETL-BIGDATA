# Catálogo de productos que monitorea DPDF-Engine.
#
# Cada producto tiene un MODELO DE REFERENCIA. Comparar precios entre plataformas
# solo tiene sentido si es el mismo artículo; por eso el matching distingue dos niveles:
#   - exacto:      la publicación es el modelo de referencia (marca + grupos de "modelo").
#   - equivalente: misma categoría y especificación (grupos de "categoria"), otra marca o genérico.
#                  Sirve para Temu/AliExpress/Alibaba, donde casi todo es genérico.
#
# Reglas de los grupos: cada grupo es una lista de alternativas; deben cumplirse TODOS los
# grupos y, dentro de cada grupo, basta con UNA alternativa. El texto se compara sin acentos,
# en minúsculas y separando números de letras ("10000mAh" -> "10000 mah", "USB-C" -> "usb c").
#
# El bloque "simulacion" alimenta el generador de ventas sintéticas (dpdf/simulacion/ventas.py).
# Las elasticidades son la "verdad" que el modelo de ML debería poder recuperar.

productos:
  - id: mouse
    nombre: Mouse inalámbrico
    categoria: Periféricos
    marca: Logitech
    modelo_referencia: Logitech M170
    precio_base_mxn: 229
    consultas:
      modelo: logitech m170
      generica: mouse inalambrico
    match:
      marca: [logitech]
      modelo: [[m170]]
      categoria: [[mouse, raton], [inalambrico, wireless, "2.4"]]
      excluir: [mouse pad, mousepad, funda, estuche, combo, teclado y mouse, kit, receptor, repuesto, skin]
      rango_exacto_mxn: [120, 600]
      rango_equivalente_mxn: [40, 700]
    simulacion: {demanda_base: 22, elasticidad_propia: -1.5, elasticidad_relativa: -1.0, crecimiento_anual: 0.06, regreso_clases: 1.35, dia_padre: 1.00}

  - id: audifonos
    nombre: Audífonos Bluetooth TWS
