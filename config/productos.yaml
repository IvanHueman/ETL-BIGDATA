      categoria: [[audifonos, audifono, auriculares, earbuds], [bluetooth, inalambricos, inalambrico, tws]]
      excluir: [funda, case, estuche de repuesto, almohadillas, gomas, repuesto, solo estuche]
      rango_exacto_mxn: [200, 900]
      rango_equivalente_mxn: [60, 1500]
    simulacion: {demanda_base: 26, elasticidad_propia: -1.6, elasticidad_relativa: -1.1, crecimiento_anual: 0.10, regreso_clases: 1.20, dia_padre: 1.30}

